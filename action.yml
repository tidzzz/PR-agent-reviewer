# action.yml
name: 'AI PR Reviewer'
description: 'Automated PR Context and Documentation Reviewer using MedTech standards.'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  github_token:
    description: 'The GITHUB_TOKEN to interact with the PR.'
    required: true
  openai_key:
    description: 'The API Key for the LLM.'
    required: true

runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    
    GITHUB_TOKEN: ${{ inputs.github_token }}
    OPENAI_API_KEY: ${{ inputs.openai_key }}